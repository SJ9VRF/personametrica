<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PersonalBench Annotation</title>
<style>body{font:16px/1.5 system-ui;max-width:900px;margin:40px auto;padding:0 20px;color:#181818}button{padding:10px 14px;margin:5px;border:1px solid #aaa;background:#fff;border-radius:8px;cursor:pointer}.sel{background:#111;color:#fff}pre{white-space:pre-wrap;background:#f6f6f6;padding:16px;border-radius:10px}small{color:#666}.row{display:flex;gap:8px;flex-wrap:wrap}.top{display:flex;justify-content:space-between;align-items:center}</style></head><body>
<div class="top"><h1>PersonalBench annotation</h1><button onclick="download()">Export JSON</button></div><p><small>Independent labels only. Reference labels are intentionally not shown in the UI.</small></p><div id="app">Load <code>tasks.json</code> from the same directory using a local HTTP server.</div>
<script>let D=[],i=0,L={};fetch('tasks.json').then(r=>r.json()).then(x=>{D=x.tasks;render()});function render(){let t=D[i]; if(!t){app.innerHTML='<h2>Complete</h2>';return} let body=t.task_type==='proactivity'?JSON.stringify(t.scenario,null,2):JSON.stringify({slot:t.slot,turn:t.turn,context:t.context,evidence:t.evidence},null,2);app.innerHTML=`<p>${i+1}/${D.length} · <b>${t.task_type}</b></p><p>${t.annotation_prompt}</p><pre>${body}</pre><div class=row>${t.label_space.map(x=>`<button class='${L[t.id]===x?'sel':''}' onclick='label(${JSON.stringify(x)})'>${x}</button>`).join('')}</div><p><button onclick='prev()'>Back</button><button onclick='next()'>Next</button></p>`}function label(x){L[D[i].id]=x;render()}function next(){i=Math.min(D.length,i+1);render()}function prev(){i=Math.max(0,i-1);render()}function download(){let b=new Blob([JSON.stringify({annotator_id:'',labels:L},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='annotations.json';a.click()}</script></body></html>
