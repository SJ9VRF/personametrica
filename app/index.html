<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PersonaMetrica Demo</title>
<style>body{margin:0;font-family:Inter,system-ui;background:#090b10;color:#f6f7fb}.wrap{max-width:1100px;margin:auto;padding:36px}.hero{padding:36px;border:1px solid #262b36;border-radius:24px;background:#11141b}h1{font-size:46px;margin:0 0 12px}.muted{color:#9da5b4}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0}.tabs button{background:#151923;border:1px solid #2a303c;color:#e9edf5;padding:10px 15px;border-radius:999px;cursor:pointer}.tabs button.active{background:#f3f5f9;color:#101217}.panel{display:none}.panel.active{display:block}.card{background:#11141b;border:1px solid #262b36;padding:18px;border-radius:16px;margin:12px 0}.badge{display:inline-block;padding:4px 8px;border-radius:8px;background:#1d2330;font-size:12px;margin-right:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:30px;font-weight:700}.old{text-decoration:line-through;color:#7c8494}.current{font-weight:700}.why{font-family:ui-monospace,monospace;line-height:1.8}</style></head><body><div class="wrap"><div class="hero"><h1>PersonaMetrica</h1><p class="muted">A local research demo of an assistant that learns, remembers, updates stale beliefs, calibrates intervention, and exposes structured decision factors.</p></div><div class="tabs" id="tabs"></div><div id="content"></div></div>
<script>
const views={
Chat:`<div class=card><div class=muted>User</div><p>Actually, mornings work better for me now.</p></div><div class=card><div class=muted>Assistant state update</div><p>Updated your work-time preference. The older evening preference is retained in history but no longer active.</p><span class=badge>memory updated</span><span class=badge>confidence 97%</span></div>`,
Memory:`<div class=card><h3>Current</h3><p class=current>Work time → morning</p><p>Response detail → concise</p><p>Technical response detail → detailed</p></div><div class=card><h3>Changed</h3><p class=old>Work time → evening</p><p class=muted>Superseded by a newer explicit preference.</p></div>`,
Goals:`<div class=card><h3>Prepare conference talk by Friday</h3><p>Priority: high · Status: active</p><div class=muted>Next: clarify success criteria → execute next concrete step → verify progress</div></div>`,
Why:`<div class="card why"><b>Decision: SUGGEST</b><br>goal relevance = 0.95<br>urgency = 0.90<br>stakes = 0.20<br>reversibility = 0.95<br>confidence = 0.91<br><br><span class=muted>This is a structured factor explanation, not hidden chain-of-thought.</span></div>`,
Feedback:`<div class=card><h3>Structured feedback</h3><p>Useful · Wrong fact · Wrong memory · Wrong assumption · Too proactive · Not proactive enough · Wrong tone · Outdated preference</p><p class=muted>Feedback becomes auditable data for reward/eval and later post-training.</p></div>`,
Evolution:`<div class=grid><div class=card><div class=muted>Temporal OS personalization</div><div class=metric>100.0%</div></div><div class=card><div class=muted>First-mention baseline</div><div class=metric>37.1%</div></div><div class=card><div class=muted>Baseline stale memory</div><div class=metric>62.9%</div></div></div><p class=muted>Synthetic controlled benchmark only; not a human-study result.</p>`};
const tabs=document.getElementById('tabs'),content=document.getElementById('content');
Object.keys(views).forEach((k,i)=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k,b);tabs.appendChild(b);let p=document.createElement('div');p.className='panel';p.id='p-'+k;p.innerHTML=views[k];content.appendChild(p);if(i===0)show(k,b)});
function show(k,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById('p-'+k).classList.add('active');b.classList.add('active')}
</script></body></html>
